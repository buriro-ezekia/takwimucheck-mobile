# Verifies the TakwimuCheck Expo application on every product branch and pull request.
name: TakwimuCheck CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Dependency, security, route generation, typecheck and web export
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check changed-line whitespace
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git show --check --format=fuller --no-renames HEAD
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Batch 9 session security invariants
        run: node scripts/check_batch09_session_security.mjs

      - name: Report Expo dependency recommendations
        continue-on-error: true
        run: npx expo install --check

      - name: Check Expo project health
        run: npx --yes expo-doctor

      - name: Export web application and generate route types
        run: npx expo export --platform web --output-dir dist-ci

      - name: Run TypeScript checks
        run: npm run typecheck