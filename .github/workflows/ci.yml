# Verifies the TakwimuCheck Expo application on every product branch and pull request.
name: TakwimuCheck CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and web export
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Check Expo project health
        run: npx --yes expo-doctor

      - name: Export web application
        run: npx expo export --platform web --output-dir dist-ci
